name: open-model-smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/open-model-smoke.yml"
      - "planprobe/agent/openai_compat.py"
      - "planprobe/agent/ollama_native.py"
      - "planprobe/agent/factory.py"
      - "planprobe/agent/context.py"
      - "planprobe/preflight.py"
      - "planprobe/models.py"
      - "README.md"
      - "docs/JD_TRACEABILITY.md"
      - "docs/MODEL_ROUTING.md"
  workflow_dispatch:

concurrency:
  group: planprobe-open-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qwen-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            nohup ollama serve > /tmp/ollama.log 2>&1 &
          fi
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
      - name: Pull Qwen coder model
        run: ollama pull qwen2.5-coder:1.5b
      - name: Record exact local model inventory
        shell: bash
        run: |
          mkdir -p artifacts
          ollama --version | tee artifacts/ollama-version.txt
          ollama list | tee artifacts/ollama-models.txt
      - name: Warm Qwen model
        run: ollama run qwen2.5-coder:1.5b "Reply with OK only." >/dev/null
      - name: Run real Qwen preflight
        shell: bash
        env:
          PLANPROBE_OLLAMA_BASE_URL: http://127.0.0.1:11434
          PLANPROBE_OLLAMA_MODEL: qwen2.5-coder:1.5b
          PLANPROBE_LLM_TIMEOUT_SECONDS: "300"
          PLANPROBE_LLM_MAX_TOKENS: "900"
          PLANPROBE_CONTEXT_ROOTS: synthetic_app/liveops_service
        run: |
          set +e
          python -m planprobe.cli preflight             --workspace .             --provider ollama             --output artifacts/qwen-preflight.json
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            cat /tmp/ollama.log || true
            exit "$code"
          fi
          python - <<'PY'
          import json
          p=json.load(open("artifacts/qwen-preflight.json"))
          assert p["provider"] == "ollama"
          assert p["metrics"]["llm_model"] == "qwen2.5-coder:1.5b"
          assert p["metrics"]["llm_calls"] >= 2
          assert p["metrics"]["source_edits"] == 0
          assert p["gate"]["status"] in {"pass","block"}
          print(json.dumps({
              "gate": p["gate"]["status"],
              "blocked": p["gate"]["blocked_assumptions"],
              "llm_calls": p["metrics"]["llm_calls"],
              "input_tokens": p["metrics"]["llm_input_tokens"],
              "output_tokens": p["metrics"]["llm_output_tokens"],
              "latency_ms": p["metrics"]["llm_latency_ms"],
              "validation_retries": p["metrics"]["llm_validation_retries"],
              "schema_fallbacks": p["metrics"]["llm_schema_fallbacks"],
              "model": p["metrics"]["llm_model"],
          }, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-preflight-evidence
          path: |
            artifacts/qwen-preflight.json
            artifacts/ollama-version.txt
            artifacts/ollama-models.txt
          if-no-files-found: warn
