name: live-smoke
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deployed-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deployed PlanProbe
        env:
          BASE_URL: https://planprobe.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
          SMOKE_TIMEOUT_SECONDS: "600"
        run: python scripts/smoke_live.py
